<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>حافظ · Hafiz</title>
  <meta name="description" content="ملاحظات وروابط وكلمات سر — متزامنة بين الكمبيوتر والموبايل ومشفرة بالكامل.">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="حافظ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply theme + direction before first paint to avoid a flash.
    (function () {
      try {
        var theme = JSON.parse(localStorage.getItem('hafiz.theme') || '"system"');
        var lang = JSON.parse(localStorage.getItem('hafiz.lang') || '"ar"');
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.lang = lang === 'en' ? 'en' : 'ar';
        document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
      } catch (e) {}
    })();
  </script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body class="auth-mode">
  <div id="app">
    <div class="loading-state" style="min-height:100dvh;justify-content:center;margin:0">
      <div class="spinner"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;text-align:center">حافظ محتاج JavaScript يكون شغال. · Hafiz needs JavaScript.</p></noscript>
</body>
</html>
